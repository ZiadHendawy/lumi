name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  agent:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3  # no floating major tag upstream
      - run: uv sync --locked
      - run: uv run ruff check --output-format=github .
      - run: uv run ruff format --check .
      - name: Unit tests
        run: uv run pytest
        env:
          TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      # Pure board helpers (date lanes, payload parsing): Node's built-in runner, no deps.
      - run: npm test

  # Evals call the real LLM and spend Groq quota, so they run on PRs and on demand only.
  evals:
    if: github.event_name != 'push'
    needs: agent
    runs-on: ubuntu-latest
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history, to diff the PR against its base
      # Evals spend Groq quota, so a PR that doesn't touch agent/ (web, docs) skips
      # them. Same git-diff check as deploy-agent. Manual runs always run them.
      - name: Did agent/ change?
        id: changed
        run: |
          if [ -z "${{ github.base_ref }}" ] || ! git diff --quiet "origin/${{ github.base_ref }}...HEAD" -- .; then
            echo "agent=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: astral-sh/setup-uv@v10.3.3  # no floating major tag upstream
        if: steps.changed.outputs.agent == 'true'
      - run: uv sync --locked
        if: steps.changed.outputs.agent == 'true'
      # PRs run the core tier (a few evals per feature, added by the PR that adds the
      # feature). The full suite spends about half of Groq's free daily tokens, so it
      # runs on demand: Actions -> CI -> Run workflow.
      - name: Core evals
        if: github.event_name == 'pull_request' && steps.changed.outputs.agent == 'true'
        run: uv run pytest -m "eval and core"
      - name: Full eval suite
        if: github.event_name == 'workflow_dispatch'
        run: uv run pytest -m eval

  # Vercel only deploys web/, so without this a pushed agent fix would never reach
  # LiveKit Cloud. Runs on main only, after the agent's lint and tests pass, and only
  # when something under agent/ changed in this push.
  deploy-agent:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: agent
    runs-on: ubuntu-latest
    concurrency: deploy-agent # never two rollouts at once
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history, to diff against the commit before this push
      - name: Did agent/ change?
        id: changed
        run: |
          before="${{ github.event.before }}"
          if [ "$before" = "0000000000000000000000000000000000000000" ] || ! git diff --quiet "$before" HEAD -- .; then
            echo "agent=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Install LiveKit CLI (pinned)
        if: steps.changed.outputs.agent == 'true'
        run: |
          curl -sSL https://github.com/livekit/livekit-cli/releases/download/v2.19.2/lk_2.19.2_linux_amd64.tar.gz | tar xz -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/lk" --version
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Deploy to LiveKit Cloud
        if: steps.changed.outputs.agent == 'true'
        # livekit.toml names the agent; these credentials authorize the deploy.
        run: lk agent deploy --yes
        env:
          LIVEKIT_URL: ${{ secrets.LIVEKIT_URL }}
          LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
          LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}
          LK_NO_SKILLS_PROMPT: "1"
